name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install locked dependencies
      run: |
        python -m pip install uv==0.12.5
        uv sync --locked --python ${{ matrix.python-version }}

    - name: Lint
      run: uv run --frozen ruff check src/ tests/

    - name: CLI help (no account activity)
      run: uv run --frozen python -m src.main --help

    - name: Tests
      run: uv run --frozen pytest tests/ -v

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'

    - name: Install audit tools
      run: python -m pip install uv==0.12.5 pip-audit==2.10.1 bandit==1.9.4

    - name: Audit locked application dependencies
      run: |
        uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file audit-requirements.txt
        python -m pip_audit -r audit-requirements.txt
        bandit -r src/

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'

    - name: Install locked development and application dependencies
      run: |
        python -m pip install uv==0.12.5
        uv sync --locked

    - name: Formatting and imports
      run: |
        uv run --frozen ruff format --check src/ tests/
        uv run --frozen isort --check-only src/ tests/

    - name: Type check
      run: uv run --frozen mypy src/

    - name: Build Python packages
      run: uv build

    - name: Check packaged configuration
      run: python -c "import glob,zipfile; p=glob.glob('dist/*.whl')[0]; assert any(n.endswith('/share/stake-mirrors-ping/config.yaml') for n in zipfile.ZipFile(p).namelist())"
