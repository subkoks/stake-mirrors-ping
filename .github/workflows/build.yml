name: Build Desktop App

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win32
            arch: x64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.16'
          architecture: ${{ matrix.arch }}
      - name: Install locked backend build environment
        run: |
          python -m pip install uv==0.12.5
          uv sync --locked --group desktop --python python
      - name: Freeze and exercise native production backend
        run: |
          uv run --frozen --python 3.13.16 --group desktop python scripts/build_backend.py
          uv run --frozen --python 3.13.16 python scripts/test_frozen_backend.py packaging/output/production/${{ matrix.platform }}-${{ matrix.arch }}/stake-backend/stake-backend${{ matrix.platform == 'win32' && '.exe' || '' }}
      - name: Install GUI tools and verify dependency graph
        working-directory: gui
        run: |
          npm ci --omit=optional --registry=https://registry.npmjs.org
          node node_modules/electron/install.js
          npm audit --include=dev --include=optional --audit-level=high --registry=https://registry.npmjs.org
          npm test
      - name: Build production application and installers
        working-directory: gui
        run: npm run build -- --publish never --${{ matrix.arch }}
      - name: Install candidate for acceptance checks
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --python 3.13.16 python scripts/install_desktop_candidate.py
      - name: Production packaged GUI checks
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node gui/e2e/desktop.cjs
          else
            node gui/e2e/desktop.cjs
          fi
      - name: Linux clean runtime acceptance (Ubuntu 22.04 and 24.04)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          for baseline in 22.04 24.04; do
            docker build --build-arg BASE=ubuntu:$baseline -t stake-clean:$baseline -f packaging/clean-linux.Dockerfile .
            docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" -v "$RUNNER_TEMP:$RUNNER_TEMP:ro" -v "$(command -v node):/node:ro" -e STAKE_DESKTOP_EXECUTABLE="$STAKE_DESKTOP_EXECUTABLE" -e STAKE_E2E_OUTPUT=/tmp -e PATH=/usr/bin:/bin -e STAKE_E2E_SCRIPT="$GITHUB_WORKSPACE/gui/e2e/desktop.cjs" stake-clean:$baseline bash -c '! command -v python3 && ! command -v python && xvfb-run -a /node "$STAKE_E2E_SCRIPT"'
          done
      - name: Build isolated fixture backend and test application
        shell: bash
        env:
          STAKE_DESKTOP_TEST: '1'
        run: |
          set -euo pipefail
          uv run --frozen --python 3.13.16 --group desktop python scripts/build_backend.py --fixture
          cd gui
          npm run build:check -- --publish never --config.directories.output=dist-fixture
          cd ..
          uv run --frozen --python 3.13.16 python scripts/install_desktop_candidate.py --fixture
      - name: Offline packaged GUI interactions
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node gui/e2e/desktop.cjs --fixture
          else
            node gui/e2e/desktop.cjs --fixture
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: desktop-failure-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/stake-desktop-*/failure.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-app-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            gui/dist/*.dmg
            gui/dist/*.zip
            gui/dist/*.exe
            gui/dist/*.AppImage
            gui/dist/*.deb
            gui/dist/*.rpm
          if-no-files-found: error
          retention-days: 14

  candidate:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: desktop-app-*
          path: candidate
          merge-multiple: true
      - name: Verify final candidate inventory and compute checksums
        run: python3 scripts/verify_desktop_artifacts.py candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-candidate
          path: candidate/*
          retention-days: 14
