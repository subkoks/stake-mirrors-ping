name: auto-merge

# Run trusted default-branch automation after CI. Never check out PR code.
# GitHub auto-merge still waits for all required checks and branch protections.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-24.04
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: Enable auto-merge for the exact tested same-repository PR
        shell: bash
        run: |
          set -euo pipefail
          # Resolve PRs through the API: workflow_run.pull_requests can be empty.
          # Recheck the current PR head so an older successful run cannot arm
          # auto-merge for a newer, untested commit.
          gh api --paginate "repos/$GH_REPO/commits/$TESTED_SHA/pulls" \
            --jq '.[] | .number' > "$RUNNER_TEMP/auto-merge-prs.txt"
          while IFS= read -r number; do
            [[ "$number" =~ ^[0-9]+$ ]] || exit 1
            pr="$(gh api "repos/$GH_REPO/pulls/$number")"
            if jq -e --arg repo "$GH_REPO" --arg sha "$TESTED_SHA" \
              '.state == "open" and .draft == false and
               .head.repo.full_name == $repo and .base.repo.full_name == $repo and
               .base.ref == "main" and .head.sha == $sha' <<< "$pr" >/dev/null; then
              gh pr merge "$number" --repo "$GH_REPO" --auto --squash \
                --match-head-commit "$TESTED_SHA"
            fi
          done < "$RUNNER_TEMP/auto-merge-prs.txt"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
